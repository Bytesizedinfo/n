<title>Spend &amp; Save</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Manrope:wght@400..700&display=swap">
<style>
/* Layout: one phone-width column. Spending leads as a big "left to spend" number; Savings sits below as a list of
   subcategories that hold money; spending labels come after with a Today/Week/Month toggle. Tab bar fixed at the bottom. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#f7f9f8; --ink:#14201b; --ink-2:#3b4843; --muted:#68746f; --line:#e1e7e4; --track:#e7ece9;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e1efe9;
  --warn:#9a6200; --warn-soft:#fbf1dc; --over:#c0352f; --over-soft:#fbe7e5; --good:#1f7a45;
  --p0:#1b8a6e; --p1:#5a63d8; --p2:#d4651c; --p3:#6250d6; --p4:#d55181; --p5:#2a78d6; --p6:#8a9691;
  --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#eda100; --c4:#e87ba4; --c5:#008300; --c6:#6250d6; --c7:#e34948; --c8:#98a29e;
  --shadow:0 1px 2px rgba(20,32,27,.05),0 6px 20px rgba(20,32,27,.045);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:20px; --r-ctl:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1311; --surface:#161d1a; --surface-2:#1b2420; --ink:#e5ebe8; --ink-2:#c0cac6; --muted:#8e9a95; --line:#25302b; --track:#222c28;
  --accent:#5fbfa6; --accent-ink:#0b1a15; --accent-soft:#183029;
  --warn:#e3a640; --warn-soft:#2d2616; --over:#ef7d74; --over-soft:#36201e; --good:#5cc486;
  --p0:#2f9c82; --p1:#7177e0; --p2:#d95926; --p3:#9085e9; --p4:#d55181; --p5:#3987e5; --p6:#6f7a76;
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#2f9a2f; --c6:#9085e9; --c7:#e66767; --c8:#6f7a76;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.18);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#161d1a; --surface-2:#1b2420; --ink:#e5ebe8; --ink-2:#c0cac6; --muted:#8e9a95; --line:#25302b; --track:#222c28;
  --accent:#5fbfa6; --accent-ink:#0b1a15; --accent-soft:#183029;
  --warn:#e3a640; --warn-soft:#2d2616; --over:#ef7d74; --over-soft:#36201e; --good:#5cc486;
  --p0:#2f9c82; --p1:#7177e0; --p2:#d95926; --p3:#9085e9; --p4:#d55181; --p5:#3987e5; --p6:#6f7a76;
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#2f9a2f; --c6:#9085e9; --c7:#e66767; --c8:#6f7a76;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.18);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.sheet-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:34rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top h1{font:600 1.5rem/1.1 var(--f-display);letter-spacing:-.01em}
.top-date{color:var(--muted);font-size:.85rem;font-weight:600}
main.wrap{padding-block:4px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
body[data-mode="onboard"] main.wrap,body[data-mode="loading"] main.wrap,body[data-mode="error"] main.wrap{padding-bottom:40px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
body[data-mode="onboard"] .tabs,body[data-mode="loading"] .tabs,body[data-mode="error"] .tabs{display:none}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0 4px;color:var(--muted);font-size:.7rem;font-weight:600;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab-add{align-self:center}
.tab-add span.plus{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.tab-add span.plus svg{width:24px;height:24px}

.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-head h2{font:600 1rem/1.25 var(--f-body)}
.card-head .link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:.85rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.banner{border-radius:14px;padding:10px 12px;font-size:.84rem;line-height:1.4;background:var(--accent-soft);color:var(--ink-2)}
.banner b{color:var(--ink)}
.warnbox{border-radius:14px;padding:10px 12px;font-size:.86rem;line-height:1.4;background:var(--over-soft);color:var(--over);display:flex;gap:8px;align-items:flex-start}
.warnbox svg{width:18px;height:18px;flex:none;margin-top:1px}
.warnbox.soft{background:var(--warn-soft);color:var(--warn)}

.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav-label{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pnav-label b{font-weight:700;font-size:.98rem}
.pnav-label span{font-size:.78rem;color:var(--muted);font-weight:600}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px}

.hero{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:20px 18px 16px;display:flex;flex-direction:column;gap:8px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grp-name{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.86rem}
.hero-num{font:600 clamp(2.9rem,14vw,3.6rem)/1 var(--f-display);letter-spacing:-.025em;font-variation-settings:"opsz" 96}
.hero-num .cur,.big .cur{font-size:.42em;letter-spacing:0;margin-right:.12em;vertical-align:.95em;color:var(--muted);font-weight:600}
.hero-num.neg{color:var(--over)}
.flow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.86rem;border-top:1px solid var(--line);padding-top:10px}
.flow span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.flow .tot{font-weight:800}
.big{font:600 2.3rem/1.05 var(--f-display);letter-spacing:-.02em;font-variation-settings:"opsz" 96}

.dot{width:10px;height:10px;border-radius:99px;flex:none;background:var(--c8);display:inline-block}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}.c6{background:var(--c6)}.c7{background:var(--c7)}.c8{background:var(--c8)}
.pc0{background:var(--p0)}.pc1{background:var(--p1)}.pc2{background:var(--p2)}.pc3{background:var(--p3)}.pc4{background:var(--p4)}.pc5{background:var(--p5)}.pc6{background:var(--p6)}
.bar{position:relative;display:block;height:8px;border-radius:99px;background:var(--track)}
.bar>i{display:block;height:100%;max-width:100%;border-radius:99px;background:var(--accent)}
.bar.warn>i{background:var(--warn)}
.bar.over>i{background:var(--over)}
.bar.thin{height:6px}
.status{display:flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;color:var(--muted)}
.status svg{width:15px;height:15px;flex:none}
.status.warn{color:var(--warn)} .status.over{color:var(--over)} .status.ok{color:var(--good)}

/* savings rows */
.sv-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sv-total b{font:600 1.7rem/1.1 var(--f-display);letter-spacing:-.01em}
.sv-total .d{font-size:.8rem;font-weight:700;color:var(--muted)}
.sv-total .d.add{color:var(--good)} .sv-total .d.less{color:var(--over)}
.sv-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:3px 10px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.sv-row:first-child{border-top:0;padding-top:2px}
.sv-row .nm{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-row .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sv-row .val.add{color:var(--good)} .sv-row .val.less{color:var(--over)} .sv-row .val.neg{color:var(--over)}
.sv-row .sub,.sv-row .bar{grid-column:2/-1}
.sv-row .sub{font-size:.78rem;color:var(--muted);font-weight:600}

/* label rows */
.cats{display:flex;flex-direction:column}
.cat-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.cat-row:first-child{border-top:0;padding-top:2px}
.cat-name{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-amt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-amt b{color:var(--ink);font-weight:700}
.cat-row .bar,.cat-row .cat-sub{grid-column:1/-1}
.cat-row .bar>i{background:var(--p1)}
.cat-sub{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted);font-weight:600}
.result-sum{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);font-weight:600;flex-wrap:wrap}

.txs{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.txs .tx:first-child,.day-head+.tx{border-top:0}
.tx-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2)}
.tx-ico .dot{width:11px;height:11px}
.tx-ico svg{width:16px;height:16px}
.tx-ico.inc{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.tx-ico.mov{color:var(--accent);background:var(--accent-soft)}
.tx-main{display:flex;flex-direction:column;min-width:0}
.tx-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.inc{color:var(--good)}
.tx-amt.mov{color:var(--muted);font-weight:650}
.tx-amt.fromsave{color:var(--over)}
.day-head{display:flex;justify-content:space-between;padding:14px 0 4px;font-size:.78rem;font-weight:700;color:var(--muted);border-top:1px solid var(--line)}
.txs .day-head:first-child{border-top:0;padding-top:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 10px;color:var(--muted);font-size:.9rem}
.empty b{color:var(--ink);font-size:1rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-ctl);border:1px solid transparent;padding:11px 16px;font-weight:700;font-size:.92rem;background:var(--accent);color:var(--accent-ink);min-height:44px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--over-soft);color:var(--over)}
.btn.small{min-height:34px;padding:6px 12px;font-size:.82rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:700;font-size:.82rem;text-align:left}
.linkbtn.muted{color:var(--muted)}
.linkbtn.danger{color:var(--over)}

.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;font-size:.84rem;color:var(--muted);white-space:nowrap;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.mini{padding:2px;border-radius:10px}
.seg.mini button{padding:6px 8px;font-size:.8rem;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.84rem;font-weight:650;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip.new{border-style:dashed;color:var(--accent)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:8px}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:flex;align-items:center;gap:7px;font-size:.88rem}
.pick span{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.field>label{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:.76rem;color:var(--muted);font-weight:500}
.input,select.input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface-2);padding:10px 12px;font-size:16px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.money-in{position:relative}
.money-in .input{padding-left:38px}
.money-in::before{content:attr(data-sym);position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:.9rem;pointer-events:none}
.amount-big{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount-big:focus-within{border-color:var(--accent)}
.amount-big span{font:600 1.4rem var(--f-display);color:var(--muted)}
.amount-big input{flex:1;min-width:0;border:0;background:none;font:600 2.6rem/1.1 var(--f-display);letter-spacing:-.02em;padding:0;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form{display:flex;flex-direction:column;gap:14px}
.split-show{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.88rem;border-radius:14px;background:var(--surface-2);padding:12px}
.split-show span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

#sheet-root{position:fixed;inset:0;z-index:20}
.sheet-backdrop{position:absolute;inset:0;background:rgba(8,14,12,.42);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:34rem;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:24px 24px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(24px);opacity:0;transition:transform .22s ease,opacity .2s}
#sheet-root.open .sheet-backdrop{opacity:1}
#sheet-root.open .sheet{transform:none;opacity:1}
.sheet-grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-head h2{font:600 1.25rem/1.2 var(--f-display)}

.list-edit{display:flex;flex-direction:column;gap:12px}
.sc-edit{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sc-edit:last-child{border-bottom:0;padding-bottom:0}
.sc-edit .more{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-edit .more .field>span{font-size:.74rem}
.sc-edit .more .input{min-height:38px;padding:7px 10px;font-size:15px}
.sc-edit .more .money-in .input{padding-left:34px}
.sc-edit .acts{grid-column:2/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cat-link{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.cat-link:first-child{border-top:0;padding-top:0}
.cat-link .t{display:flex;flex-direction:column;min-width:0}
.cat-link .t b{display:flex;align-items:center;gap:8px;font-weight:650}
.cat-link .t span{font-size:.8rem;color:var(--muted)}
.cat-link>svg{width:18px;height:18px;color:var(--muted);flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:99px;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 3px var(--surface)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.sub-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sub-row:first-child{border-top:0;padding-top:0}
.sub-row .nm{font-weight:650;background:none;border:0;padding:0;text-align:left}
.sub-row .due{font-size:.78rem;color:var(--muted);font-weight:600}
.sub-row .due.soon{color:var(--warn)} .sub-row .due.late{color:var(--over)}
.sub-row .right{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:10px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setting-row:first-child{border-top:0;padding-top:0}
.setting-row .t{display:flex;flex-direction:column;min-width:0}
.setting-row .t b{font-weight:650}
.setting-row .t span{font-size:.8rem;color:var(--muted)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .v{font:600 1.45rem/1.15 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:.76rem;font-weight:700;color:var(--muted)}
.d.up-bad,.d.down-bad{color:var(--over)} .d.up-good,.d.down-good{color:var(--good)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-body)}
.ax{fill:var(--muted);font-size:10.5px;font-weight:600}
.lbl{fill:var(--ink-2);font-size:11px;font-weight:700}
.grid-l{stroke:var(--line);stroke-width:1}

  const whereBtn = (id, sub) => `<button data-act="sp-from" data-v="${esc(id)}" aria-pressed="${T.from === id}"><b><i class="dot ${id === 'spend' ? 'pc1' : 'pc' + (saveCat(id).color ?? 6)}"></i>${esc(id === 'spend' ? 'Spending' : saveCat(id).name)}</b><span>${esc(sub)}</span></button>`;
  const body = () => {
    const a = r2(parseMoney(T.amt));
    return `<div class="form">${existing ? '' : kindSeg('out')}
      <label class="amount-big"><span>${esc(sym())}</span><input id="sp-amt" inputmode="decimal" placeholder="0.00" value="${esc(T.amt)}" aria-label="Amount" autocomplete="off"></label>
      <div class="field"><span>Category</span><div class="chips" role="group" aria-label="Category">${s.labels.map(l => `<button class="chip" data-act="sp-label" data-v="${esc(l.id)}" aria-pressed="${T.label === l.id}"><i class="dot c${l.color ?? 8}"></i>${esc(l.name)}</button>`).join('')}<button class="chip new" data-act="sp-newlabel">+ New category</button></div></div>
      <div class="field"><span>Paid from</span><div class="pick">${whereBtn('spend', `${money(spendLeftOn(T.d, existing))} left`)}${showSave ? s.saveCats.map(c => whereBtn(c.id, `${money(saveBal(c.id))} · savings`)).join('') : ''}</div>
        ${!showSave ? `<button class="linkbtn muted" data-act="sp-showsave">Pay from savings instead</button>` : ''}</div>
      <p class="small" id="sp-hint">${hint(a)}</p>
      <div class="grid2"><label class="field"><span>Date</span><input class="input" type="date" id="sp-date" value="${esc(T.d)}"></label><label class="field"><span>Note <span class="hint">optional</span></span><input class="input" id="sp-note" value="${esc(T.note)}" placeholder="e.g. Chicken rice" autocomplete="off"></label></div>
      <p class="small" id="sp-err" style="color:var(--over)" hidden></p>
      <div class="btn-row"><button class="btn ${T.from !== 'spend' ? 'danger' : ''}" data-act="sp-save">${T.from !== 'spend' ? `Take from ${esc(saveCat(T.from).name)}` : existing ? 'Save changes' : 'Add spending'}</button>${existing ? '<button class="btn danger" data-act="sp-del">Delete</button>' : ''}</div></div>`;
  };
  const paint = () => { $('.sheet-body').innerHTML = body(); };
  openSheet(existing ? 'Edit spending' : 'Add', body(), sheet => {
    if (!existing) setTimeout(() => { const a = $('#sp-amt'); if (a && matchMedia('(pointer:fine)').matches) a.focus(); }, 60);
    const onIn = e => { const id = e.target.id; if (id === 'sp-amt') T.amt = e.target.value; if (id === 'sp-date') T.d = e.target.value || today(); if (id === 'sp-note') T.note = e.target.value; if (id === 'sp-amt' || id === 'sp-date') $('#sp-hint').innerHTML = hint(r2(parseMoney(T.amt))); };
    sheet.addEventListener('input', onIn); sheet.addEventListener('change', onIn);
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
      if (a === 'kind' && b.dataset.v !== 'out') switchKind(b.dataset.v, T.amt);
      if (a === 'sp-label') { T.label = b.dataset.v; $$('[data-act="sp-label"]', sheet).forEach(x => x.setAttribute('aria-pressed', x === b)); }
      if (a === 'sp-newlabel') { const keep = { amt: T.amt, note: T.note, d: T.d, from: T.from }; openLabelEdit(null, { onSaved: nid => openSpend(existing, { ...keep, label: nid }), onDone: () => openSpend(existing, { ...keep, label: T.label }) }); }
      if (a === 'sp-from') { T.from = b.dataset.v; paint(); }
      if (a === 'sp-showsave') { showSave = true; paint(); }
      if (a === 'sp-del') armDanger(b, 'Tap again to delete', () => { removeTx([existing.id]); closeSheet(); toast('Deleted'); });
      if (a === 'sp-save') {
        const amt = r2(parseMoney(T.amt)), err = $('#sp-err'), fail = m => { err.textContent = m; err.hidden = false; };
        if (!(amt > 0)) return fail('Enter an amount above zero.');
        if (!T.label) return fail('Pick a category.');
        const go = () => {
          const tx = { id: existing ? existing.id : newId(), d: T.d, t: 'out', amt, label: T.label, from: T.from, note: (T.note || '').trim() };
          existing ? replaceTx(existing.id, tx) : addTx([tx]); closeSheet();
          if (T.from !== 'spend') toast(`${money(amt)} taken from Savings → ${saveCat(T.from).name}. ${money(saveBal(T.from))} left there.`, 'warn', 4500);
          else { const left = spendMonth(periodFor(T.d)).left; if (left < 0) toast(`Spending is ${money(-left)} over this month`, 'over', 4500); else toast(`${money(left)} left to spend this month`); }
        };
        if (T.from !== 'spend' && !(existing && existing.from === T.from)) armDanger(b, `Tap again to take ${money(amt)} from ${saveCat(T.from).name}`, go); else go();
      }
    });
  });
}

/* money in */
function openIn(existing, preset = {}) {
  const s = S.settings;
  const M = existing ? { src: existing.src, amt: String(existing.amt), d: existing.d, note: existing.note || '', spend: String(existing.spend || 0), dest: existing.spend > 0 ? 'spend' : (Object.keys(existing.save || {})[0] || 'other') }
    : Object.assign({ src: 'pay', amt: '', d: today(), note: '', spend: '', dest: 'other' }, preset);
  if (M.amt == null) M.amt = '';
  if (!existing && M.src === 'pay') { if (M.amt === '') M.amt = String(s.pay || ''); M.spend = String(Math.min(r2(parseMoney(M.amt)), +s.split.spend || 0)); }
  let spendTouched = !!existing;
  const payShow = () => { const a = r2(parseMoney(M.amt)), sp = r2(parseMoney(M.spend)), sv = r2(a - sp); return sv < -0.004 ? `<p class="small" style="color:var(--over)">Spending is more than the pay. Lower it.</p>` : `<div class="split-show"><span><i class="dot pc1" style="margin-right:8px"></i>Spending this month</span><span>${money(sp)}</span><span><i class="dot pc0" style="margin-right:8px"></i>Savings${existing && Object.keys(existing.save || {}).some(k => k !== 'other') ? '' : ' → Other'}</span><span>${money(sv)}</span></div>`; };
  const body = () => `<div class="form">${existing ? '' : kindSeg('in')}
    <div class="seg" role="group" aria-label="Kind of money"><button data-act="in-src" data-v="pay" aria-pressed="${M.src === 'pay'}">Pay</button><button data-act="in-src" data-v="other" aria-pressed="${M.src === 'other'}">Other money</button></div>
    <label class="amount-big"><span>${esc(sym())}</span><input id="in-amt" inputmode="decimal" placeholder="0.00" value="${esc(M.amt)}" aria-label="Amount" autocomplete="off"></label>
    ${M.src === 'pay' ? `<label class="field"><span>For spending</span><div class="money-in" data-sym="${esc(sym())}"><input class="input" id="in-spend" inputmode="decimal" value="${esc(M.spend)}"></div></label><div id="in-show">${payShow()}</div><p class="muted small">Savings lands in Other. Sort it into savings categories whenever you like.</p>`
      : `<div class="field"><span>Where should it go?</span><div class="pick"><button data-act="in-dest" data-v="spend" aria-pressed="${M.dest === 'spend'}"><b><i class="dot pc1"></i>Spending</b><span>this month</span></button>${s.saveCats.map(c => `<button data-act="in-dest" data-v="${esc(c.id)}" aria-pressed="${M.dest === c.id}"><b><i class="dot pc${c.color ?? 6}"></i>${esc(c.name)}</b><span>savings · ${money(saveBal(c.id))}</span></button>`).join('')}${existing ? '' : '<button data-act="in-newcat"><b>+ New category</b><span>for savings</span></button>'}</div></div>`}
    <div class="grid2"><label class="field"><span>Date</span><input class="input" type="date" id="in-date" value="${esc(M.d)}"></label><label class="field"><span>Note <span class="hint">optional</span></span><input class="input" id="in-note" value="${esc(M.note)}" placeholder="${M.src === 'pay' ? 'Pay' : 'e.g. Ang bao'}" autocomplete="off"></label></div>
    <p class="small" id="in-err" style="color:var(--over)" hidden></p>
    <div class="btn-row"><button class="btn" data-act="in-save">${existing ? 'Save changes' : M.src === 'pay' ? 'Log pay' : 'Add money'}</button>${existing ? '<button class="btn danger" data-act="in-del">Delete</button>' : ''}</div></div>`;
  openSheet(existing ? 'Edit money in' : 'Add', body(), sheet => {
    const onIn = e => {
      const t = e.target;
      if (t.id === 'in-amt') { M.amt = t.value; if (M.src === 'pay' && !spendTouched) { M.spend = String(Math.min(r2(parseMoney(M.amt)), +s.split.spend || 0)); const i = $('#in-spend'); if (i) i.value = M.spend; } }
      if (t.id === 'in-spend') { M.spend = t.value; spendTouched = true; }
      if (t.id === 'in-date') M.d = t.value || today();
      if (t.id === 'in-note') M.note = t.value;
      const sh = $('#in-show'); if (sh) sh.innerHTML = payShow();
    };
    sheet.addEventListener('input', onIn); sheet.addEventListener('change', onIn);
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
      if (a === 'kind' && b.dataset.v !== 'in') switchKind(b.dataset.v, M.amt);
      if (a === 'in-src') { M.src = b.dataset.v; if (M.src === 'pay') { if (!M.amt) M.amt = String(s.pay || ''); if (!spendTouched) M.spend = String(Math.min(r2(parseMoney(M.amt)), +s.split.spend || 0)); } $('.sheet-body').innerHTML = body(); }
      if (a === 'in-dest') { M.dest = b.dataset.v; $$('[data-act="in-dest"]', sheet).forEach(x => x.setAttribute('aria-pressed', x === b)); }
      if (a === 'in-newcat') { const keep = { src: 'other', amt: M.amt, d: M.d, note: M.note }; openSaveCatEdit(null, { onSaved: nid => openIn(null, { ...keep, dest: nid }), onDone: () => openIn(null, { ...keep, dest: M.dest }) }); }
      if (a === 'in-del') armDanger(b, 'Tap again to delete', () => { removeTx([existing.id]); closeSheet(); toast('Deleted'); });
      if (a === 'in-save') {
        const amt = r2(parseMoney(M.amt)), err = $('#in-err'), fail = m => { err.textContent = m; err.hidden = false; };
        if (!(amt > 0)) return fail('Enter an amount above zero.');
        let spend = 0, save = {};
        if (M.src === 'pay') {
          spend = r2(parseMoney(M.spend)); if (spend < 0 || spend > amt + 0.004) return fail('Spending has to be between zero and the pay amount.');
          const sv = r2(amt - spend);
          if (existing && existing.save && Object.keys(existing.save).length) { // keep how an earlier pay was sorted; adjust Other for any difference
            save = clone(existing.save); let diff = r2(sv - sum(Object.values(save)));
            if (diff > 0) save.other = r2((save.other || 0) + diff);
            else for (const k of ['other', ...Object.keys(save).filter(k => k !== 'other')]) { if (diff >= -0.004) break; const take = Math.min(save[k] || 0, -diff); save[k] = r2((save[k] || 0) - take); diff = r2(diff + take); }
            for (const k of Object.keys(save)) if (!(save[k] > 0)) delete save[k];
          } else if (sv > 0) save = { other: sv };
        } else if (M.dest === 'spend') spend = amt; else save = { [M.dest]: amt };
        const tx = { id: existing ? existing.id : newId(), d: M.d, t: 'in', src: M.src, amt, spend, save, note: (M.note || '').trim() };
        existing ? replaceTx(existing.id, tx) : addTx([tx]); closeSheet();
        toast(`${money(amt)} in: ${[spend ? `Spending ${mw(spend)}` : '', ...Object.entries(save).map(([k, v]) => `${saveCat(k).name} ${mw(v)}`)].filter(Boolean).join(', ')}`, '', 4500);
      }
    });
  });
}

/* moves */
function openMove(existing, preset = {}) {
  const s = S.settings;
  const otherBal = saveBal('other');
  const V = existing ? { from: existing.from, to: existing.to, amt: String(existing.amt), d: existing.d, note: existing.note || '' }
    : Object.assign(otherBal > 0.004 ? { from: 'other', to: firstSorted() } : { from: 'spend', to: 'other' }, { amt: '', d: today(), note: '' }, preset);
  if (V.from === V.to) V.to = V.from === 'other' ? firstSorted() : 'other';
  if (V.amt == null) V.amt = '';
  const opts = v => [['spend', `Spending (${money(spendLeftOn(V.d, null))} left)`], ...s.saveCats.map(c => [c.id, `Savings · ${c.name} (${money(saveBal(c.id))})`])].map(([id, l]) => `<option value="${esc(id)}" ${v === id ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const risky = () => V.from !== 'spend' && V.to === 'spend';
  const body = () => `<div class="form">${existing ? '' : kindSeg('move')}
    <label class="amount-big"><span>${esc(sym())}</span><input id="mv-amt" inputmode="decimal" placeholder="0.00" value="${esc(V.amt)}" aria-label="Amount"></label>
    <label class="field"><span>From</span><select class="input" id="mv-from">${opts(V.from)}</select></label>
    <label class="field"><span>To</span><select class="input" id="mv-to">${opts(V.to)}</select></label>
    ${existing ? '' : '<button class="linkbtn" data-act="mv-newcat" style="align-self:flex-start">+ New savings category</button>'}
    ${risky() ? `<span class="warnbox">${I.warn}<span>This moves savings into Spending. You’ll be asked to confirm.</span></span>` : ''}
    <div class="grid2"><label class="field"><span>Date</span><input class="input" type="date" id="mv-date" value="${esc(V.d)}"></label><label class="field"><span>Note <span class="hint">optional</span></span><input class="input" id="mv-note" value="${esc(V.note)}"></label></div>
    <p class="small" id="mv-err" style="color:var(--over)" hidden></p>
    <div class="btn-row"><button class="btn ${risky() ? 'danger' : ''}" data-act="mv-save">${existing ? 'Save changes' : 'Move money'}</button>${existing ? '<button class="btn danger" data-act="mv-del">Delete</button>' : ''}</div></div>`;
  openSheet(existing ? 'Edit move' : 'Add', body(), sheet => {
    const onIn = e => { const t = e.target; if (t.id === 'mv-amt') V.amt = t.value; if (t.id === 'mv-date') V.d = t.value || today(); if (t.id === 'mv-note') V.note = t.value; if ((t.id === 'mv-from' || t.id === 'mv-to') && e.type === 'change') { V[t.id.slice(3)] = t.value; $('.sheet-body').innerHTML = body(); } };
    sheet.addEventListener('input', onIn); sheet.addEventListener('change', onIn);
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
      if (a === 'kind' && b.dataset.v !== 'move') switchKind(b.dataset.v, V.amt);
      if (a === 'mv-newcat') { const keep = { from: V.from, amt: V.amt, d: V.d, note: V.note }; openSaveCatEdit(null, { onSaved: nid => openMove(null, { ...keep, to: nid }), onDone: () => openMove(null, { ...keep, to: V.to }) }); }
      if (a === 'mv-del') armDanger(b, 'Tap again to delete', () => { removeTx([existing.id]); closeSheet(); toast('Deleted'); });
      if (a === 'mv-save') {
        const amt = r2(parseMoney(V.amt)), err = $('#mv-err'), fail = m => { err.textContent = m; err.hidden = false; };
        if (!(amt > 0)) return fail('Enter an amount above zero.');
        if (V.from === V.to) return fail('Pick two different places.');
        const go = () => { const tx = { id: existing ? existing.id : newId(), d: V.d, t: 'move', amt, from: V.from, to: V.to, note: (V.note || '').trim() }; existing ? replaceTx(existing.id, tx) : addTx([tx]); closeSheet(); toast(`Moved ${money(amt)} from ${whereName(V.from)} to ${whereName(V.to)}`); };
        if (risky() && !existing) armDanger(b, `Tap again to move ${money(amt)} out of savings`, go); else go();
      }
    });
  });
}

/* one savings subcategory */
function openSaveCat(id) {
  const c = saveCat(id); if (c === NOCAT) return;
  const p = periodAt(0), bal = saveBal(id), m = saveMonth(id, p), tgt = +c.target || 0;
  const hist = []; for (let i = 5; i >= 0; i--) { const q = periodAt(-i), at = q.end < today() ? q.end : today(); hist.push({ v: Math.max(0, saveBal(id, at)), cur: i === 0, label: shortLabel(q), tip: `${q.label}\n${c.name}: ${money(saveBal(id, at))}` }); }
  openSheet(`Savings · ${c.name}`, `<div class="form">
    <div><span class="eyebrow">In ${esc(c.name)} now</span><div class="big" style="${bal < 0 ? 'color:var(--over)' : ''}"><span class="cur">${esc(sym())}</span>${nf2.format(Math.abs(bal))}</div></div>
    ${tgt ? `<span class="bar"><i style="width:${Math.max(0, Math.min(100, bal / tgt * 100)).toFixed(1)}%;background:var(--p${c.color})"></i></span><span class="muted small">${Math.round(Math.max(0, Math.min(1, bal / tgt)) * 100)}% of ${mw(tgt)} · ${money(Math.max(0, tgt - bal))} to go</span>` : ''}
    <div class="flow"><span>Start of ${esc(monthName(p))}</span><span>${money(r2(bal - m.net))}</span><span>Added this month</span><span>+${money(m.inn)}</span><span>Taken out this month</span><span>−${money(m.out)}</span><span class="tot">Now</span><span class="tot">${money(bal)}</span></div>
    ${id === 'other' ? '<p class="muted small">Pay’s savings and each month’s leftover spending land here until you move them.</p>' : ''}
    <div><div class="card-head" style="margin-bottom:6px"><h2 style="font-size:.9rem">End of each month</h2></div>${colChart(hist, 0, '', `var(--p${c.color ?? 6})`)}</div>
    <div class="btn-row"><button class="btn soft" data-act="sc-in">Move money in</button><button class="btn ghost" data-act="sc-out">Move money out</button></div>
    <div class="btn-row"><button class="btn ghost" data-act="sc-edit">Edit category</button><button class="btn ghost" data-act="sc-act">See activity</button></div></div>`, sheet => {
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'sc-in') openMove(null, { to: id, from: id === 'other' ? 'spend' : 'other' });
      if (b.dataset.act === 'sc-out') openMove(null, { from: id, to: id === 'other' ? firstSorted() : 'other' });
      if (b.dataset.act === 'sc-act') { closeSheet(); Object.assign(S.f, { where: id, type: 'all', label: 'all', q: '', range: 'all', limit: 150 }); location.hash = 'activity'; }
      if (b.dataset.act === 'sc-edit') openSaveCatEdit(id, { onDone: () => openSaveCat(id) });
    });
  });
}

/* create or edit a savings category */
function openSaveCatEdit(id, opts = {}) {
  const s = S.settings, c = id ? s.saveCats.find(x => x.id === id) : null, used = new Set(s.saveCats.map(x => x.color));
  const D = c ? { name: c.name, color: c.color ?? 6, start: c.start ? String(c.start) : '', target: c.target ? String(c.target) : '' }
    : { name: '', color: [0, 1, 2, 3, 4, 5, 6].find(x => !used.has(x)) ?? 4, start: '', target: '' };
  openSheet(c ? `Edit ${c.name}` : 'New savings category', `<div class="form">
    <label class="field"><span>Name</span><input class="input" id="se-name" value="${esc(D.name)}" placeholder="e.g. New phone, Gifts, Course fees" autocomplete="off"></label>
    <div class="field"><span>Colour</span><div class="swatches" role="group" aria-label="Colour">${[0, 1, 2, 3, 4, 5, 6].map(i => `<button class="swatch pc${i}" data-act="se-color" data-v="${i}" aria-pressed="${D.color === i}" aria-label="Colour ${i + 1}"></button>`).join('')}</div></div>
    <div class="grid2"><label class="field"><span>Already saved <span class="hint">optional</span></span><div class="money-in" data-sym="${esc(sym())}"><input class="input" id="se-start" inputmode="decimal" value="${esc(D.start)}" placeholder="0"></div><span class="hint">Money you had before using this app</span></label>
      <label class="field"><span>Target <span class="hint">optional</span></span><div class="money-in" data-sym="${esc(sym())}"><input class="input" id="se-target" inputmode="decimal" value="${esc(D.target)}" placeholder="None"></div></label></div>
    ${c ? `<p class="muted small">Now ${money(saveBal(c.id))}. To add more, move money in from Other or Spending.</p>` : '<p class="muted small">To fill it, move money in from Other or Spending, or pick it when money comes in.</p>'}
    <p class="small" id="se-err" style="color:var(--over)" hidden></p>
    <div class="btn-row"><button class="btn" data-act="se-save">${c ? 'Save' : 'Create category'}</button>${c && c.id !== 'other' ? '<button class="btn danger" data-act="se-del">Delete</button>' : ''}${opts.onDone ? '<button class="btn ghost" data-act="se-back">Back</button>' : ''}</div>
    ${c && c.id === 'other' ? '<p class="muted small">Other can’t be deleted: it’s where unsorted savings go.</p>' : ''}</div>`, sheet => {
    if (!c) setTimeout(() => { const i = $('#se-name'); if (i && matchMedia('(pointer:fine)').matches) i.focus(); }, 60);
    sheet.addEventListener('input', e => { const t = e.target; if (t.id === 'se-name') D.name = t.value; if (t.id === 'se-start') D.start = t.value; if (t.id === 'se-target') D.target = t.value; });
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
      if (a === 'se-color') { D.color = +b.dataset.v; $$('[data-act="se-color"]', sheet).forEach(x => x.setAttribute('aria-pressed', x === b)); }
      if (a === 'se-back') opts.onDone();
      if (a === 'se-del') { const bal = saveBal(c.id); if (Math.abs(bal) > 0.004) { const err = $('#se-err'); err.textContent = `Move the ${money(bal)} in ${c.name} to another category first.`; err.hidden = false; return; } armDanger(b, 'Tap again to delete', () => { s.saveCats = s.saveCats.filter(x => x.id !== c.id); saveSettings(); closeSheet(); toast(`${c.name} deleted`); }); }
      if (a === 'se-save') {
        const name = D.name.trim(), err = $('#se-err'), fail = m => { err.textContent = m; err.hidden = false; };
        if (!name) return fail('Give the category a name.');
        if (s.saveCats.some(x => x.id !== (c && c.id) && x.name.trim().toLowerCase() === name.toLowerCase())) return fail(`You already have a savings category called ${name}.`);
        const v = { name, color: D.color, start: r2(parseMoney(D.start)), target: r2(parseMoney(D.target)) };
        const nid = c ? c.id : newId('v');
        if (c) Object.assign(c, v); else s.saveCats.push({ id: nid, ...v });
        saveSettings(); toast(c ? `${name} saved` : `${name} created`);
        if (opts.onSaved) opts.onSaved(nid); else if (opts.onDone) opts.onDone(); else closeSheet();
      }
    });
  });
}

/* one spending category (stored as a "label") */
function openLabel(id, kind) {
  const l = S.settings.labels.find(x => x.id === id); if (!l) return;
  let k = kind || S.labelPeriod;
  const body = () => {
    const r = rangeFor(k), spent = labelSpent(id, r), n = k === 'day' ? 14 : k === 'week' ? 8 : 6;
    const hist = []; for (let i = n - 1; i >= 0; i--) { const rr = shiftRange(r, -i); hist.push({ r: rr, v: labelSpent(id, rr) }); }
    const first = S.tx.reduce((m, t) => t.t === 'out' && t.label === id && t.d < m ? t.d : m, '9999-12-31');
    const done = hist.slice(0, -1).filter(x => x.r.end >= first), avg = done.length ? sum(done.map(x => x.v)) / done.length : 0;
    const lab = rr => rr.kind === 'day' ? String(parts(rr.start)[2]) : rr.kind === 'week' ? fmtD(rr.start) : MON[parts(periodFor(rr.start).start)[1] - 1];
    const items = S.tx.filter(t => t.t === 'out' && t.label === id && t.d >= r.start && t.d <= r.end);
    const allOut = r2(sum(S.tx.filter(t => t.t === 'out' && t.d >= r.start && t.d <= r.end).map(t => t.amt)));
    return `<div class="form">
      <div class="seg" role="group" aria-label="Period">${['day', 'week', 'month'].map(v => `<button data-act="lb-k" data-v="${v}" aria-pressed="${k === v}">${PER_NAME[v]}</button>`).join('')}</div>
      <div><span class="eyebrow">${esc(rangeLabel(r))}</span><div class="big"><span class="cur">${esc(sym())}</span>${nf2.format(spent)}</div><span class="muted small">${allOut ? `${Math.round(spent / allOut * 100)}% of everything you spent ${periodWord(r)}` : `Nothing spent ${periodWord(r)}`}</span></div>
      <div><div class="card-head" style="margin-bottom:6px"><h2 style="font-size:.9rem">Last ${n} ${k === 'day' ? 'days' : k === 'week' ? 'weeks' : 'months'}</h2><span class="muted small">${done.length ? `average ${money(avg)} ${PER_LABEL[k]}` : ''}</span></div>${colChart(hist.map(x => ({ v: x.v, cur: x.r.start === r.start, label: lab(x.r), tip: `${rangeLabel(x.r)}\n${l.name}: ${money(x.v)}` })), 0, '')}</div>
      <div><div class="card-head" style="margin-bottom:4px"><h2 style="font-size:.9rem">${esc(rangeLabel(r))}</h2><span class="muted small">${items.length} item${items.length === 1 ? '' : 's'}</span></div>${items.length ? `<div class="txs">${items.slice(0, 12).map(txRow).join('')}</div>` : `<p class="muted small">Nothing spent ${periodWord(r)}.</p>`}</div>
      <div class="btn-row"><button class="btn ghost" data-act="lb-edit">Edit category</button><button class="btn ghost" data-act="lb-all">All ${esc(l.name)} spending</button></div></div>`;
  };
  openSheet(l.name, body(), sheet => {
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
      if (a === 'lb-k') { k = b.dataset.v; $('.sheet-body').innerHTML = body(); }
      if (a === 'lb-edit') openLabelEdit(id, { onDone: () => openLabel(id, k) });
      if (a === 'lb-all') { closeSheet(); Object.assign(S.f, { label: id, type: 'out', where: 'all', q: '', range: 'all', limit: 150 }); location.hash = 'activity'; }
      if (a === 'edit-tx') { const f = findTx(b.dataset.id); if (f) openSpend(f.t); }
    });
  });
}
function openLabelEdit(id, opts = {}) {
  const s = S.settings, l = id ? s.labels.find(x => x.id === id) : null, used = new Set(s.labels.map(x => x.color));
  const D = l ? { name: l.name, color: l.color ?? 8 } : { name: '', color: [0, 1, 2, 3, 4, 5, 6, 7, 8].find(x => !used.has(x)) ?? 8 };
  openSheet(l ? `Edit ${l.name}` : 'New spending category', `<div class="form">
    <label class="field"><span>Name</span><input class="input" id="le-name" value="${esc(D.name)}" placeholder="e.g. Bubble tea, Gifts, Grab" autocomplete="off"></label>
    <div class="field"><span>Colour</span><div class="swatches" role="group" aria-label="Colour">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => `<button class="swatch c${i}" data-act="le-color" data-v="${i}" aria-pressed="${D.color === i}" aria-label="Colour ${i + 1}"></button>`).join('')}</div></div>
    <p class="small" id="le-err" style="color:var(--over)" hidden></p>
    <div class="btn-row"><button class="btn" data-act="le-save">${l ? 'Save' : 'Create category'}</button>${l ? '<button class="btn danger" data-act="le-del">Delete</button>' : ''}${opts.onDone ? '<button class="btn ghost" data-act="le-back">Back</button>' : ''}</div></div>`, sheet => {
    if (!l) setTimeout(() => { const i = $('#le-name'); if (i && matchMedia('(pointer:fine)').matches) i.focus(); }, 60);
    sheet.addEventListener('input', e => { if (e.target.id === 'le-name') D.name = e.target.value; });
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
      if (a === 'le-color') { D.color = +b.dataset.v; $$('[data-act="le-color"]', sheet).forEach(x => x.setAttribute('aria-pressed', x === b)); }
      if (a === 'le-back') opts.onDone();
      if (a === 'le-del') { const inUse = S.tx.some(t => t.label === l.id); armDanger(b, inUse ? 'Tap again (past spending becomes Uncategorised)' : 'Tap again to delete', () => { s.labels = s.labels.filter(x => x.id !== l.id); saveSettings(); closeSheet(); toast(`${l.name} deleted`); }); }
      if (a === 'le-save') {
        const name = D.name.trim(), err = $('#le-err'), fail = m => { err.textContent = m; err.hidden = false; };
        if (!name) return fail('Give the category a name.');
        if (s.labels.some(x => x.id !== (l && l.id) && x.name.trim().toLowerCase() === name.toLowerCase())) return fail(`You already have a spending category called ${name}.`);
        const nid = l ? l.id : newId('l');
        if (l) Object.assign(l, { name, color: D.color }); else s.labels.push({ id: nid, name, color: D.color });
        saveSettings(); toast(l ? `${name} saved` : `${name} created`);
        if (opts.onSaved) opts.onSaved(nid); else if (opts.onDone) opts.onDone(); else closeSheet();
      }
    });
  });
}

/* subscriptions (paid from Spending) */
function openSubEdit(id) {
  const s = S.settings, x = id ? s.subs.find(v => v.id === id) : null;
  const D = x ? clone(x) : { id: newId('s'), name: '', amount: '', cycle: 'monthly', next: addDays(today(), 1), label: s.labels.find(l => l.id === 'subs') ? 'subs' : (s.labels[0]?.id || '') };
  openSheet(x ? 'Edit subscription' : 'New subscription', `<div class="form">
    <label class="field"><span>Name</span><input class="input" id="sb-name" value="${esc(D.name)}" placeholder="e.g. Spotify"></label>
    <div class="grid2"><label class="field"><span>Amount</span><div class="money-in" data-sym="${esc(sym())}"><input class="input" id="sb-amt" inputmode="decimal" value="${esc(D.amount)}" placeholder="0.00"></div></label>
    <label class="field"><span>Billed</span><select class="input" id="sb-cycle">${Object.entries({ monthly: 'Monthly', yearly: 'Yearly', weekly: 'Weekly' }).map(([k, v]) => `<option value="${k}" ${D.cycle === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
    <div class="grid2"><label class="field"><span>Next payment</span><input class="input" type="date" id="sb-next" value="${esc(D.next)}"></label>
    <label class="field"><span>Category</span><select class="input" id="sb-label">${s.labels.map(l => `<option value="${esc(l.id)}" ${D.label === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label></div>
    <p class="small" id="sb-err" style="color:var(--over)" hidden></p>
    <div class="btn-row"><button class="btn" data-act="sb-save">${x ? 'Save' : 'Add subscription'}</button>${x ? '<button class="btn danger" data-act="sb-del">Remove</button>' : ''}</div></div>`, sheet => {
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'sb-del') armDanger(b, 'Tap again to remove', () => { s.subs = s.subs.filter(v => v.id !== x.id); saveSettings(); closeSheet(); toast('Subscription removed'); });
      if (b.dataset.act === 'sb-save') {
        const name = $('#sb-name').value.trim(), amount = r2(parseMoney($('#sb-amt').value)), next = $('#sb-next').value, err = $('#sb-err');
        if (!name) { err.textContent = 'Give it a name.'; err.hidden = false; return; }
        if (!(amount > 0)) { err.textContent = 'Enter an amount above zero.'; err.hidden = false; return; }
        if (!next) { err.textContent = 'Pick the next payment date.'; err.hidden = false; return; }
        const v = { id: D.id, name, amount, cycle: $('#sb-cycle').value, next, label: $('#sb-label').value, active: true };
        if (x) Object.assign(x, v); else s.subs.push(v);
        saveSettings(); closeSheet(); toast(x ? 'Subscription saved' : 'Subscription added');
      }
    });
  });
}
function paySub(id) {
  const s = S.settings, x = s.subs.find(v => v.id === id); if (!x) return;
  const t = today(), d = x.next <= t ? x.next : t;
  const lab = s.labels.find(l => l.id === x.label) ? x.label : (s.labels.find(l => l.id === 'subs') ? 'subs' : (s.labels[0]?.id || 'other'));
  x.next = x.cycle === 'yearly' ? addMonths(x.next, 12) : x.cycle === 'weekly' ? addDays(x.next, 7) : addMonths(x.next, 1);
  persist('settings');
  addTx([{ id: newId(), d, t: 'out', amt: r2(x.amount), label: lab, from: 'spend', note: x.name }]);
  toast(`Logged ${x.name} ${money(x.amount)} from Spending. Next ${fmtD(x.next)}.`);
}

/* ---------- export / restore ---------- */
async function offerFile(filename, text) {
  if (STANDALONE) { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: filename.endsWith('.json') ? 'application/json' : 'text/csv' })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast(`Downloaded ${filename}`); return; } catch (e) {} }
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) { try { const r = await dl.save({ filename, data: text }); if (r && r.status === 'saved') toast('File saved'); return; } catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save is already waiting for your answer.'); return; } } }
  openSheet('Copy your data', `<div class="form"><p class="muted small">Saving files isn’t available here. Copy this text and paste it into a file named <b>${esc(filename)}</b>.</p><textarea class="input" id="copy-box" rows="10" readonly style="font:12px/1.4 ui-monospace,monospace">${esc(text)}</textarea><button class="btn" data-act="copy-box">Copy</button></div>`);
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function exportCSV() {
  const rows = [['Date', 'Type', 'Amount', 'From', 'To or category', 'Note']];
  for (const t of [...S.tx, ...S.sweeps].sort((a, b) => a.d < b.d ? -1 : 1)) {
    if (t.t === 'out') rows.push([t.d, 'Spent', (-t.amt).toFixed(2), whereName(t.from), label(t.label).name, t.note]);
    else if (t.t === 'in') rows.push([t.d, t.src === 'pay' ? 'Pay' : 'Money in', t.amt.toFixed(2), '', [t.spend ? `Spending ${t.spend}` : '', ...Object.entries(t.save || {}).map(([k, v]) => `${saveCat(k).name} ${v}`)].filter(Boolean).join('; '), t.note]);
    else if (t.t === 'move') rows.push([t.d, 'Move', t.amt.toFixed(2), whereName(t.from), whereName(t.to), t.note]);
    else rows.push([t.d, t.amt >= 0 ? 'Leftover to savings' : 'Overspend from savings', Math.abs(t.amt).toFixed(2), t.amt >= 0 ? 'Spending' : 'Savings · Other', t.amt >= 0 ? 'Savings · Other' : 'Spending', `${monthName(t.p)} spending`]);
  }
  offerFile(`spend-save-${today()}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'));
}
function exportJSON() { offerFile(`spend-save-backup-${today()}.json`, JSON.stringify({ app: 'spend-save', v: 1, exported: new Date().toISOString(), settings: S.settings, months: S.months }, null, 1)); }
async function restoreFrom(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { return toast('That file isn’t a Spend & Save backup.', 'over'); }
  if (!data || data.app !== 'spend-save' || !data.settings || typeof data.months !== 'object') return toast('That file isn’t a Spend & Save backup.', 'over');
  const n = sum(Object.values(data.months).map(m => (m.tx || []).length));
  openSheet('Restore backup', `<div class="form"><p>This replaces everything here with the backup from <b>${esc(fmtDY((data.exported || today()).slice(0, 10)))}</b>: ${n} entries.</p><div class="btn-row"><button class="btn" data-act="restore-go">Replace with backup</button><button class="btn ghost" data-act="close-sheet">Cancel</button></div></div>`, sheet => {
    sheet.addEventListener('click', e => {
      if (!e.target.closest('[data-act="restore-go"]')) return;
      const old = Object.keys(S.months);
      S.settings = Object.assign(defaultSettings(), data.settings, { onboarded: true });
      S.months = {}; for (const [k, m] of Object.entries(data.months)) if (/^m-\d{4}-\d{2}$/.test(k) && Array.isArray(m.tx)) S.months[k] = { tx: m.tx };
      persist('settings'); new Set([...old, ...Object.keys(S.months)]).forEach(persist);
      closeSheet(); refresh(); toast('Backup restored');
    });
  });
}
function resetAll() {
  const old = Object.keys(S.months);
  if (S.local) { clearTimeout(localTimer); localTimer = null; try { localStorage.removeItem(LKEY); } catch (e) {} S.months = {}; S.settings = null; S.mode = 'onboard'; S.draft = defaultSettings(); renderView(); toast('All your data was deleted.'); return; }
  if (S.mode === 'demo') { S.settings = Object.assign(defaultSettings(), { onboarded: true }); S.months = {}; refresh(); toast('Example data cleared. Changes still aren’t saved here.'); return; }
  S.months = {}; old.forEach(persist); S.settings = null; dirty.delete('settings');
  S.db.doc(`data/users/${S.uid}/settings`).delete().catch(() => {});
  S.mode = 'onboard'; S.draft = defaultSettings(); renderView(); toast('All your data was deleted.');
}

/* ---------- toast & tooltip ---------- */
let toastTimer;
function toast(msg, level = '', ms = 3200) { const el = $('#toast'); el.textContent = msg; el.className = 'show ' + (level || ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = level || ''; }, ms); }
const tip = $('#tip'); let tipEl = null;
function showTip(el) {
  tipEl = el; tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2; x = Math.max(8, Math.min(window.innerWidth - tw - 8, x)); let y = r.top - th - 8; if (y < 8) y = r.bottom + 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; $$('.hit.on').forEach(h => h.classList.remove('on')); if (el.classList.contains('hit')) el.classList.add('on');
}
function hideTip() { tip.hidden = true; tipEl = null; $$('.hit.on').forEach(h => h.classList.remove('on')); }
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el); });
document.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && e.target.closest && e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType !== 'mouse') { tipEl === el ? hideTip() : showTip(el); } else if (!el) hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });

/* ---------- global events ---------- */
const ACT = {
  go: el => { closeSheet(); location.hash = el.dataset.view; },
  add: () => openSpend(null),
  move: () => openMove(null),
  period: el => { S.offset = Math.min(0, S.offset + +el.dataset.d); renderView(); },
  'close-sheet': () => closeSheet(),
  'log-pay': () => openIn(null, { src: 'pay' }),
  'sort-other': () => openMove(null, { from: 'other', to: firstSorted(), amt: String(saveBal('other')) }),
  'save-view': el => { S.saveView = el.dataset.v; lsSet('spend-save:saveView', S.saveView); renderView(); },
  savecat: el => openSaveCat(el.dataset.id),
  label: el => openLabel(el.dataset.id, el.dataset.k),
  'label-edit': el => openLabelEdit(el.dataset.id),
  'label-period': el => { S.labelPeriod = el.dataset.v; lsSet('spend-save:labelPeriod', S.labelPeriod); renderView(); },
  'where-activity': el => { Object.assign(S.f, { where: el.dataset.id, type: 'all', label: 'all', q: '', range: 'month', limit: 150 }); location.hash = 'activity'; },
  'edit-tx': el => { const f = findTx(el.dataset.id); if (!f) return; const t = f.t; if (t.t === 'out') openSpend(t); else if (t.t === 'in') openIn(t); else openMove(t); },
  'sweep-info': () => toast('Worked out from that month’s spending. Edit the spending and this updates by itself.', '', 4500),
  'plan-tab': el => { S.planTab = el.dataset.tab; if (S.view !== 'plan') location.hash = 'plan'; else renderView(); },
  'f-type': el => { S.f.type = el.dataset.v; S.f.limit = 150; $$('[data-act="f-type"]').forEach(b => b.setAttribute('aria-pressed', b === el)); renderActList(); },
  'f-clear': () => { Object.assign(S.f, { q: '', type: 'all', where: 'all', label: 'all', range: 'month', from: '', to: '', limit: 150 }); renderView(); },
  'f-moreRows': () => { S.f.limit += 300; renderActList(); },
  'pay-sub': el => paySub(el.dataset.id),
  'edit-sub': el => openSubEdit(el.dataset.id),
  'savecat-edit': el => openSaveCatEdit(el.dataset.id),
  'export-csv': () => exportCSV(),
  'export-json': () => exportJSON(),
  'copy-box': () => { const t = $('#copy-box'); if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => toast('Copied'), () => { t.select(); toast('Select all and copy'); }); else { t.select(); toast('Select all and copy'); } },
  reset: el => armDanger(el, S.mode === 'demo' ? 'Tap again to clear' : 'Tap again to delete everything', resetAll),
  'hide-install': () => { lsSet(LKEY + ':hide-install', '1'); renderView(); },
  'ob-finish': () => { const d = S.draft; if (d.split.spend > d.pay) return toast('Spending is more than your pay. Lower it first.', 'warn'); d.onboarded = true; S.settings = d; S.mode = (S.db || S.local) ? 'live' : 'demo'; persist('settings'); refresh(); window.scrollTo(0, 0); toast('You’re set. Log your pay when it comes in.'); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || (el.closest('.sheet-body') && !['close-sheet', 'copy-box', 'go'].includes(el.dataset.act))) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f === 'q') { S.f.q = t.value; S.f.limit = 150; renderActList(); }
  if (S.mode === 'onboard' && S.draft) {
    if (t.dataset.draft === 'pay') S.draft.pay = r2(parseMoney(t.value));
    if (t.dataset.draft === 'spend') S.draft.split.spend = r2(parseMoney(t.value));
    const el = $('#ob-split'); if (el) el.innerHTML = splitHtml(S.draft);
  }
});
document.addEventListener('change', e => {
  const t = e.target, s = S.settings;
  if (t.id === 'restore-file' && t.files[0]) { restoreFrom(t.files[0]); t.value = ''; return; }
  if (t.dataset.f && ['range', 'where', 'label', 'from', 'to'].includes(t.dataset.f)) { S.f[t.dataset.f] = t.value; S.f.limit = 150; if (t.dataset.f === 'range') renderView(); else renderActList(); return; }
  if (!s || S.mode === 'onboard') return;
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.value;
    if (k === 'pay') s.pay = r2(parseMoney(v));
    else if (k === 'spend') s.split = { ...s.split, spend: r2(parseMoney(v)) };
    else if (k === 'monthStart') { s.monthStart = +v; S.offset = 0; }
    else if (k === 'symbol') { s.symbol = v.trim() || 'S$'; $$('.money-in').forEach(m => m.dataset.sym = s.symbol); }
    saveSettings(false); const el = $('#split-show'); if (el) el.innerHTML = splitHtml(s); return;
  }
});

try { window.claude?.hot?.snapshot?.(() => ({ view: S.view, offset: S.offset, planTab: S.planTab })); } catch (e) {}
const start = data => { if (data && data.planTab) S.planTab = data.planTab; boot(); };
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
